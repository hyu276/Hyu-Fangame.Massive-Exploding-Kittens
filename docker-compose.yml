services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exploding-kittens-app
    ports:
      - "51399:51399"
    environment:
      - NODE_ENV=production
      - PORT=51399
      - SERVER_ORIGINS=*
      - FLATFILE_DIR=/app/storage/data
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

networks:
  default:
    driver: bridge
