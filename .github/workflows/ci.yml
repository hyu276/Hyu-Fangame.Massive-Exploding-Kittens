name: CI / Build Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests & Bot Simulators
        run: npm test

      - name: Typecheck and Build Client
        run: npm run build

      - name: Build Server
        run: npm run build:server

      - name: Run Server Socket & Transport Tests
        run: npm run test:server
